<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مانیفست فدک</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d6cdf">
<style>
  * { box-sizing: border-box; }
  body { font-family: Tahoma, Vazirmatn, sans-serif; background: #f2f4f8; margin: 0; padding: 12px 12px 34px; color: #222; font-size: 14px; }
  h1 { text-align: center; font-size: 19px; margin: 6px 0 12px; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { padding: 8px 14px; border: 0; border-radius: 8px; background: #d9dee8; cursor: pointer; font-family: inherit; }
  .tabs button.active { background: #2d6cdf; color: #fff; }
  .toolbar { display: flex; gap: 8px; justify-content: center; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .btn { padding: 6px 12px; border: 1px solid #2d6cdf; background: #fff; color: #2d6cdf; border-radius: 8px; cursor: pointer; font-family: inherit; }
  .btn.danger { border-color: #c33; color: #c33; }
  .panel { position: sticky; top: 0; z-index: 5; background: #fff; border: 2px solid #2d6cdf; border-radius: 10px; padding: 10px; margin-bottom: 10px; box-shadow: 0 2px 6px #0003; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-bottom: 6px; gap: 6px; }
  .panel-list { font-size: 12px; color: #444; margin-bottom: 6px; }
  .wagon { background: #fff; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 1px 3px #0002; overflow: hidden; }
  .wagon summary { padding: 12px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; background: #fafbfd; }
  .comp { border-top: 1px solid #eee; padding: 10px; }
  .comp-title { font-weight: bold; margin-bottom: 6px; }
  .comp-desc { font-size: 17px; font-weight: bold; color: #1f4fb3; background: #eef4ff; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; min-height: 20px; }
  .seat-box { border: 1px solid #e3e7ef; border-radius: 8px; padding: 8px; margin-bottom: 6px; }
  .seat-box.done { background: #e8f7ec; }
  .seat-head { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
  .summary-line { font-size: 12px; background: #f5f7fb; border-radius: 6px; padding: 6px 8px; color: #234; margin-top: 6px; }
  .daily-add, .opt-add { display: flex; gap: 6px; margin-bottom: 10px; }
  .daily-add input, .opt-add input { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #bbb; font-family: inherit; }
  .daily-add button, .opt-add button { padding: 8px 14px; background: #2d6cdf; color: #fff; border: 0; border-radius: 8px; font-family: inherit; cursor: pointer; }
  .task { background: #fff; border-radius: 8px; padding: 10px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .task span { flex: 1; }
  .task.done span { text-decoration: line-through; color: #999; }
  .task button { border: 0; background: none; color: #c33; font-size: 18px; cursor: pointer; }
  .opt-group { background: #fff; border-radius: 10px; padding: 10px; margin-bottom: 10px; box-shadow: 0 1px 3px #0002; }
  .opt-group h3 { margin: 0 0 8px; font-size: 15px; }
  .opt-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
  .opt-item span { flex: 1; }
  .opt-item button { border: 0; background: none; color: #2d6cdf; cursor: pointer; font-family: inherit; }
  .opt-item button.del { color: #c33; font-size: 16px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row label { display: flex; flex-direction: column; font-size: 11px; color: #555; }
  select { padding: 5px; border-radius: 6px; border: 1px solid #bbb; font-family: inherit; font-size: 13px; max-width: 100%; }
  .hidden { display: none !important; }
  .note { font-size: 12px; color: #666; margin: 4px 0 10px; }

  .robot { position: fixed; top: 10px; right: 10px; z-index: 20; width: 44px; height: 44px; border-radius: 50%; background: #2d6cdf; color: #fff; border: 0; font-size: 22px; cursor: pointer; box-shadow: 0 2px 6px #0004; }
  .bubble { position: fixed; top: 62px; right: 10px; z-index: 20; width: 230px; background: #fff; border: 1px solid #2d6cdf; border-radius: 10px; padding: 10px; font-size: 13px; line-height: 2; box-shadow: 0 2px 8px #0003; }
  .bubble small { display: block; color: #666; font-size: 11px; margin-bottom: 4px; }
  .sign { position: fixed; bottom: 6px; left: 8px; z-index: 10; font-size: 11px; color: #777; pointer-events: none; }
</style>
</head>
<body>

<button id="robotBtn" class="robot" title="بیت امروز">🤖</button>
<div id="bubble" class="bubble hidden"></div>
<div class="sign">برنامه‌نویسی توسط جناب آقای امیرمحمد اسمعیلی</div>

<h1>مانیفست فدک</h1>

<div class="tabs">
  <button id="tabM" class="active">ثبت حضور</button>
  <button id="tabD">چک‌لیست روزانه</button>
  <button id="tabS">تنظیمات</button>
</div>

<section id="manifest">
  <div class="toolbar">
    <button id="copyBtn" class="btn">کپی خلاصه</button>
    <button id="resetBtn" class="btn danger">پاک کردن همه</button>
    <span id="total"></span>
  </div>

  <div id="panel" class="panel hidden">
    <div class="panel-head">
      <span id="panelTitle"></span>
      <button id="closePanel" class="btn">بستن پنل</button>
    </div>
    <div class="panel-list" id="panelList"></div>
    <div class="row">
      <label>نوع مسافر<select data-pf="type"></select></label>
      <label>کسر کوپه<select data-pf="cut"></select></label>
      <label>نفر اضافه<select data-pf="extra"></select></label>
      <label>نیامده<select data-pf="absent"></select></label>
      <label>خردسال/طفل<select data-pf="kids"></select></label>
      <label>بین راه<select data-pf="midway"></select></label>
    </div>
  </div>

  <div id="wagons"></div>
</section>

<section id="daily" class="hidden">
  <div class="daily-add">
    <input id="taskInput" placeholder="کار جدید...">
    <button id="addTask">افزودن</button>
  </div>
  <div id="tasks"></div>
</section>

<section id="settings" class="hidden">
  <p class="note">گزینه‌های جدید را اینجا اضافه، ویرایش یا حذف کنید.</p>
  <div id="optGroups"></div>
</section>

<script>
const HAFEZ = [
  "الا یا ایها الساقی ادر کاسا و ناولها\nکه عشق آسان نمود اول ولی افتاد مشکل‌ها",
  "ای دل غم‌دیده حالت به شود دل بد مکن\nوین سر شوریده باز آید به سامان غم مخور",
  "بیا تا گل برافشانیم و می در ساغر اندازیم\nفلک را سقف بشکافیم و طرحی نو دراندازیم",
  "مژده ای دل که مسیحا نفسی می‌آید\nکه ز انفاس خوشش بوی کسی می‌آید",
  "دوش وقت سحر از غصه نجاتم دادند\nو اندر آن ظلمت شب آب حیاتم دادند"
];
function hafezOfTheDay() {
  return HAFEZ[Math.floor(Date.now() / 86400000) % HAFEZ.length];
}

const DEFAULTS = {
  type:   ["۴خ","۳خ","۲خ","۱خ","۴م","۳م","۲م","۱م","۴ز","۳ز","۲ز","۱ز","۳ز ۱م","۱م ۳ز","۲خ ۲خ","۲خ ۲م","۳خ ۱م","۲ز ۲م"],
  cut:    ["کسر کوپه ۱","کسر کوپه ۲","کسر کوپه ۳"],
  extra:  ["۱ خردسال","۲ خردسال","۳ خردسال","۴ خردسال","۵ خردسال","۱ طفل","۲ طفل","۳ طفل","۴ طفل","۵ طفل"],
  absent: ["۱م نیامده","۲م نیامده","۳م نیامده","۴م نیامده","۱ز نیامده","۲ز نیامده","۳ز نیامده","۴ز نیامده","۲خ نیامده","۳خ نیامده","۴خ نیامده"],
  kids:   ["۱ نفر","۲ نفر","۳ نفر","۴ نفر"],
  midway: ["تهران","مشهد","نیشابور","نقاب","شاهرود","سمنان","ورامین","کرج","قزوین","اکبرآباد","رشت","کرمانشاه","سپیددشت","ملایر","زنجان","اردبیل","ساری","قم","اراک","درود","اندیمشک","شوش","اهواز","خرمشهر"]
};
const LABELS = { type: "نوع مسافر", cut: "کسر کوپه", extra: "نفر اضافه", absent: "نیامده", kids: "خردسال/طفل در خانواده", midway: "مسافرین بین راه" };
const FIELDS = Object.keys(LABELS);
const WAGONS = 11, COMPS = 11, SEATS_PER_COMP = 4;
const TOTAL_SEATS = COMPS * SEATS_PER_COMP;

const KEY = "fadak_manifest_v2", DKEY = "fadak_daily_v1", OKEY = "fadak_options_v1";
let data    = JSON.parse(localStorage.getItem(KEY) || "null") || migrate();
let daily   = JSON.parse(localStorage.getItem(DKEY) || "[]");
let options = JSON.parse(localStorage.getItem(OKEY) || "null") || JSON.parse(JSON.stringify(DEFAULTS));
for (const f of FIELDS) if (!options[f]) options[f] = JSON.parse(JSON.stringify(DEFAULTS[f]));
if (!options.midway.includes("تهران")) options.midway = JSON.parse(JSON.stringify(DEFAULTS.midway));
saveOpts();
let sel = new Set();

const save      = () => localStorage.setItem(KEY, JSON.stringify(data));
const saveDaily = () => localStorage.setItem(DKEY, JSON.stringify(daily));
function saveOpts() { localStorage.setItem(OKEY, JSON.stringify(options)); }

function migrate() {
  const old = JSON.parse(localStorage.getItem("fadak_manifest_v1") || "{}");
  const out = {};
  for (const k in old) {
    const [w, c] = k.split("-");
    out[`${w}-${(+c - 1) * SEATS_PER_COMP + 1}`] = { ...old[k] };
  }
  return out;
}

const fa = n => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const key = (w, s) => `${w}-${s}`;
const compOf = s => Math.ceil(s / SEATS_PER_COMP);
const opts = (list, cur, ph = "—") =>
  `<option value="">${ph}</option>` + list.map(v => `<option value="${esc(v)}" ${v === (cur || "") ? "selected" : ""}>${esc(v)}</option>`).join("");

const countDone = w => { let n = 0; for (let s = 1; s <= TOTAL_SEATS; s++) if (data[key(w, s)]?.ok) n++; return n; };
const totalDone = () => { let n = 0; for (let w = 1; w <= WAGONS; w++) n += countDone(w); return n; };
const updateTotal = () => {
  document.getElementById("total").textContent = `ثبت‌شده: ${fa(totalDone())} از ${fa(WAGONS * TOTAL_SEATS)} صندلی`;
};

function describe(w, s) {
  const d = data[key(w, s)];
  if (!d || !d.ok) return "";
  const parts = [];
  if (d.type)   parts.push(`نوع: ${d.type}`);
  if (d.cut)    parts.push(d.cut);
  if (d.extra)  parts.push(`نفر اضافه: ${d.extra}`);
  if (d.absent) parts.push(d.absent);
  if (d.kids)   parts.push(`در خانواده: ${d.kids}`);
  if (d.midway) parts.push(`بین راه: ${d.midway}`);
  const who = parts.length ? parts.join("، ") : "اطلاعات خاصی ثبت نشده";
  return `صندلی ${fa(s)} ـ این صندلی این شخص آمده: ${who}.`;
}

// هر صندلی مقدار خودش را دارد؛ مقادیر تکراری هم به همان تعداد نوشته می‌شوند
function compSummary(w, c) {
  const all = [];
  for (let i = 1; i <= SEATS_PER_COMP; i++) {
    const s = (c - 1) * SEATS_PER_COMP + i;
    const d = data[key(w, s)];
    if (!d || !d.ok) continue;
    if (d.type)   all.push(d.type);
    if (d.cut)    all.push(d.cut);
    if (d.extra)  all.push(d.extra);
    if (d.absent) all.push(d.absent);
    if (d.kids)   all.push(`خانواده: ${d.kids}`);
    if (d.midway) all.push(`بین راه: ${d.midway}`);
  }
  if (!all.length) return "";
  return `مسافرین این کوپه ${all.join(" ، ")} می‌باشد`;
}

function seatBox(w, s) {
  const d = data[key(w, s)] || {};
  return `
  <div class="seat-box ${d.ok ? "done" : ""}" data-w="${w}" data-s="${s}">
    <div class="seat-head">
      <span>صندلی ${fa(s)}</span>
      <label><input type="checkbox" class="pick" ${d.ok ? "checked" : ""}> ثبت</label>
    </div>
    <div class="summary-line ${d.ok && describe(w, s) ? "" : "hidden"}" id="sum-${w}-${s}">${esc(describe(w, s))}</div>
  </div>`;
}

function render() {
  let html = "";
  for (let w = 1; w <= WAGONS; w++) {
    let comps = "";
    for (let c = 1; c <= COMPS; c++) {
      const seats = [];
      for (let i = 1; i <= SEATS_PER_COMP; i++) seats.push((c - 1) * SEATS_PER_COMP + i);
      comps += `<div class="comp" data-cw="${w}" data-cc="${c}">
        <div class="comp-title">کوپه ${fa(c)}</div>
        <div class="comp-desc" id="cdesc-${w}-${c}">${esc(compSummary(w, c))}</div>` +
        seats.map(s => seatBox(w, s)).join("") + `</div>`;
    }
    html += `
    <details class="wagon" ${w === 1 ? "open" : ""}>
      <summary>
        <span>سالن ${fa(w)}</span>
        <span id="cnt-${w}">${fa(countDone(w))} / ${fa(TOTAL_SEATS)}</span>
      </summary>
      ${comps}
    </details>`;
  }
  document.getElementById("wagons").innerHTML = html;
  updateTotal();
  renderPanel();
}

function refreshSeat(w, s) {
  const box = document.querySelector(`.seat-box[data-w="${w}"][data-s="${s}"]`);
  if (!box) return;
  const d = data[key(w, s)] || {};
  box.classList.toggle("done", !!d.ok);
  const line = document.getElementById(`sum-${w}-${s}`);
  line.textContent = describe(w, s);
  line.classList.toggle("hidden", !(d.ok && describe(w, s)));
  const c = compOf(s);
  document.getElementById(`cdesc-${w}-${c}`).textContent = compSummary(w, c);
  document.getElementById(`cnt-${w}`).textContent = `${fa(countDone(w))} / ${fa(TOTAL_SEATS)}`;
  updateTotal();
}

function renderPanel() {
  const panel = document.getElementById("panel");
  if (sel.size === 0) { panel.classList.add("hidden"); return; }
  panel.classList.remove("hidden");
  const list = [...sel].map(k => { const [w, s] = k.split("-"); return `سالن ${fa(w)} صندلی ${fa(s)}`; });
  document.getElementById("panelTitle").textContent = `${fa(sel.size)} صندلی انتخاب شده`;
  document.getElementById("panelList").textContent = list.join("، ");
  document.querySelectorAll("#panel select").forEach(el => {
    const f = el.dataset.pf;
    el.innerHTML = opts(options[f], "", f === "kids" ? "بدون" : "—");
  });
}

document.getElementById("wagons").addEventListener("change", e => {
  if (!e.target.classList.contains("pick")) return;
  const box = e.target.closest(".seat-box");
  const w = box.dataset.w, s = box.dataset.s, k = key(w, s);
  data[k] = data[k] || {};
  data[k].ok = e.target.checked;
  if (e.target.checked) sel.add(k); else sel.delete(k);
  save();
  refreshSeat(w, s);
  renderPanel();
});

document.getElementById("panel").addEventListener("change", e => {
  const f = e.target.dataset.pf;
  if (!f) return;
  const v = e.target.value;
  if (!v) return;
  const keys = [...sel];
  for (const k of keys) {
    data[k] = data[k] || {};
    data[k][f] = v;
  }
  save();
  for (const k of keys) { const [w, s] = k.split("-"); refreshSeat(w, s); }
  e.target.value = "";
});

document.getElementById("closePanel").onclick = () => { sel.clear(); renderPanel(); };

document.getElementById("copyBtn").onclick = async () => {
  const lines = [];
  for (let w = 1; w <= WAGONS; w++) for (let c = 1; c <= COMPS; c++) {
    const t = compSummary(w, c);
    if (t) lines.push(`سالن ${fa(w)} کوپه ${fa(c)}: ${t}`);
  }
  const text = "مانیفست فدک\n" + lines.join("\n");
  try { await navigator.clipboard.writeText(text); alert("کپی شد"); }
  catch { prompt("متن را کپی کنید:", text); }
};

document.getElementById("resetBtn").onclick = () => {
  if (confirm("همه اطلاعات ثبت‌شده پاک شود؟")) { data = {}; sel.clear(); save(); render(); }
};

const bubble = document.getElementById("bubble");
document.getElementById("robotBtn").onclick = () => {
  if (!bubble.classList.contains("hidden")) { bubble.classList.add("hidden"); return; }
  bubble.innerHTML = `<small>بیت امروز از حافظ</small>${esc(hafezOfTheDay()).replace(/\n/g, "<br>")}`;
  bubble.classList.remove("hidden");
};
bubble.classList.add("hidden");

function renderSettings() {
  document.getElementById("optGroups").innerHTML = FIELDS.map(k => `
    <div class="opt-group">
      <h3>${LABELS[k]}</h3>
      <div class="opt-add">
        <input data-add="${k}" placeholder="گزینه جدید...">
        <button data-addbtn="${k}">افزودن</button>
      </div>
      ${options[k].map((v, i) => `
        <div class="opt-item">
          <span>${esc(v) || "(خالی)"}</span>
          <button data-edit="${k}" data-i="${i}">ویرایش</button>
          <button class="del" data-del="${k}" data-i="${i}">×</button>
        </div>`).join("")}
    </div>`).join("");
}

document.getElementById("optGroups").addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.addbtn) {
    const k = t.dataset.addbtn;
    const v = document.querySelector(`input[data-add="${k}"]`).value.trim();
    if (!v) return;
    if (options[k].includes(v)) { alert("این گزینه قبلاً وجود دارد"); return; }
    options[k].push(v);
    saveOpts(); renderSettings(); renderPanel();
  } else if (t.dataset.del !== undefined) {
    const k = t.dataset.del, i = +t.dataset.i;
    if (confirm(`«${options[k][i]}» حذف شود؟`)) {
      options[k].splice(i, 1);
      saveOpts(); renderSettings(); renderPanel();
    }
  } else if (t.dataset.edit !== undefined) {
    const k = t.dataset.edit, i = +t.dataset.i;
    const nv = prompt("ویرایش گزینه:", options[k][i]);
    if (nv !== null && nv.trim()) {
      options[k][i] = nv.trim();
      saveOpts(); renderSettings(); renderPanel();
    }
  }
});

function showTab(name) {
  for (const k of ["manifest", "daily", "settings"]) document.getElementById(k).classList.toggle("hidden", k !== name);
  document.getElementById("tabM").classList.toggle("active", name === "manifest");
  document.getElementById("tabD").classList.toggle("active", name === "daily");
  document.getElementById("tabS").classList.toggle("active", name === "settings");
}
document.getElementById("tabM").onclick = () => showTab("manifest");
document.getElementById("tabD").onclick = () => showTab("daily");
document.getElementById("tabS").onclick = () => { renderSettings(); showTab("settings"); };

function renderDaily() {
  document.getElementById("tasks").innerHTML = daily.map((t, i) => `
    <div class="task ${t.done ? "done" : ""}">
      <input type="checkbox" data-i="${i}" ${t.done ? "checked" : ""}>
      <span>${esc(t.text)}</span>
      <button data-del="${i}">×</button>
    </div>`).join("");
}
document.getElementById("addTask").onclick = () => {
  const inp = document.getElementById("taskInput");
  const v = inp.value.trim();
  if (!v) return;
  daily.push({ text: v, done: false });
  inp.value = "";
  saveDaily(); renderDaily();
};
document.getElementById("tasks").addEventListener("change", e => {
  if (e.target.dataset.i === undefined) return;
  daily[e.target.dataset.i].done = e.target.checked;
  saveDaily(); renderDaily();
});
document.getElementById("tasks").addEventListener("click", e => {
  if (e.target.dataset.del === undefined) return;
  daily.splice(e.target.dataset.del, 1);
  saveDaily(); renderDaily();
});

render();
renderDaily();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>

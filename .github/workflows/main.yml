name: Build Android APK
on:
  workflow_dispatch:

env:
  APP_NAME: "Fadak Manifest"
  APP_ID: "com.hadaf.manifest"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Copy site files
        run: |
          mkdir -p app/www
          rsync -a --exclude='.git' --exclude='.github' --exclude='app' ./ app/www/

      - name: Create Android project
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
